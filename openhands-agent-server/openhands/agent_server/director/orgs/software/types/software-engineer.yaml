---
# The type of a team that builds software. It is the type of every team
# whose proposal names none.
name: software-engineer
description: Builds and changes software in its folder.
agents:
    ic:
        writes: true
        title: IC
        tools:
            - read_team_context
            - raise_escalation
            - resolve_escalation
            - report
            - write_spec
            - write_contracts
            - msg_manager
            - propose_teams
            - msg_team
            - hand_over
            - stop_team
            - submit_review
            - review_team
        lead_tools:
            - read_team_context
            - report
            - review_team
        text: |
            Your team builds software in its folder. Do the code work yourself.
    manager:
        title: Manager
        tools:
            - read_team_context
            - raise_escalation
            - resolve_escalation
            - report
            - msg_ic
            - approve_teams
            - decline_teams
            - prune_team
        lead_tools:
            - read_team_context
            - report
            - settle_teams
        text: |
            Approve a proposal only if each sub-team is one clear concern.
            Prune only a team that clearly cannot work: stuck, or repeating what
            fails. Rare, never a precaution. Write to a slow team first, and judge a
            team only after several tasks.
documents:
    spec: How your team works inside its folder.
    contracts: >-
        What teams promise each other: types, endpoints, file formats.
    report: A decision and why, a setback, what failed.
actions:
    propose_teams: >-
        Split only by concern. Do not split work that shares files, needs
        constant agreement, or is smaller than the cost of briefing and
        reviewing a team. Work in parallel is a result of a good split, not a
        reason for one.
    submit_review: Commit, then submit when the work is done.
    review_team: >-
        Read the diff of what you rely on, run the repository's checks on it,
        and compare it with the contracts you set and with the team's task.
        Decide when the work reaches you; do not wait for the other teams.
        Before you submit your own work, check that what you accepted from
        your sub-teams fits together across their contracts.
review:
    checklist_skill: codereview
