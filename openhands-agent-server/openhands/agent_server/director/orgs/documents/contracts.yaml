---
# What the sub-teams of a team promise each other. The team writes it and
# each of its sub-teams reads it.
name: contracts
description: What teams promise each other.
tool: edit_contracts
tool_description: >-
    IC only, with sub-teams. Change the contracts between your sub-teams
    with the commands of your file editor: `str_replace` to change one
    place, `insert` to add text after a line, or at the end with no
    `insert_line`. The contracts are kept outside the working tree. Every
    sub-team reads them and is told of the change with its next message.
protocol: contracts
rules:
    everyone: >-
        Contracts: what teams promise each other. Promises go only in
        contracts; do not repeat them in a spec.
    writer: >-
        A proposal of sub-teams gives, in `contracts`, what they must keep
        between them: each sub-team is told it.
    reviewer: >-
        When you accept with `review_team`, its `contracts` adds to the
        contracts between your sub-teams what all of them may rely on from
        now; they are told with their next message.
    lead_reviewer: >-
        Contracts are not yours: the Division Lead {overseer} settles them
        with the teams.
    lead_overseer: >-
        Contracts wait for you with the teams. Per contracts, in `contracts`
        of `settle_teams`: the org's, the session's, or a text you write
        that keeps what both sides need. Taking one side's contracts whole
        often breaks the other side's code. If you do not take the
        session's, its {writer} is told to follow up.
