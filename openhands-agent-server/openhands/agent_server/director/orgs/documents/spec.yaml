---
# How a team works inside its folder. It is the team's own: no other team
# reads it.
name: spec
description: How your team works inside its folder.
tool: write_spec
tool_description: >-
    IC only. Write the spec of your folder, how your team works inside it,
    with the commands of your file editor: `create` with the whole of it in
    `file_text`, `str_replace` to change one place, `insert` to add text
    after a line. It is kept outside the working tree and is your team's
    own; sub-teams see only the contracts of the split that made them. What
    teams promise each other goes in contracts, not here.
protocol: spec
rules:
    everyone: 'Spec: how your team works inside its folder.'
    writer: Write the spec with `write_spec`.
    manager: After you approve or prune, your {writer} rewrites its spec.
    lead_reviewer: >-
        With `specs` you may choose, per folder, the org's spec, the
        session's, or a text you write. Keep promises between teams out of a
        spec.
    hand_over: "`write_spec` works here: rewrite your team's spec."
