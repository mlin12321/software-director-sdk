---
# What every type starts from. A type file says only what it changes:
# mappings are merged key by key, a list or a plain value takes the place
# of what is here. An org's own `types/_defaults.yaml` goes over this one.
documents:
    # The documents the director keeps in team memory for every team. Each
    # is written with a tool of the director's and read by whom it says
    # here; both are what the director does, so a type changes only what a
    # document holds.
    spec:
        written_with: write_spec
        readers: [team]
        holds: How your team works inside its folder.
    contracts:
        written_with: edit_contracts
        readers: [team, below]
        holds: >-
            What teams promise each other: types, endpoints, file formats.
    report:
        written_with: report
        readers: [team]
        holds: A decision and why, a setback, what failed.
    # A type may add documents of its own. Each is a file in the team's
    # folder that the member working there writes and commits. Its readers
    # are the team, the teams below, or both; a document goes to no team
    # above or beside.
    #
    # baseline:
    #     path: baseline.md
    #     readers: [team, below]
    #     holds: What every sub-team compares against.
