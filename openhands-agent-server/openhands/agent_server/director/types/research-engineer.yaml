---
# The type of a team that builds what research runs on: an experiment
# harness, a data pipeline, a baseline, an evaluation.
name: research-engineer
description: Builds and runs what experiments need, such as a harness, a baseline or an evaluation.
ic: |
    Your team builds what research directions run on: a harness, a data
    pipeline, a baseline, an evaluation. Other teams' results are only as
    good as what you deliver, so say exactly what it measures and how it was
    checked.
    - Deliver the code, the command that runs it, and one recorded run with
      its output committed.
    - Keep the data a result is reported on apart from the data anything is
      tuned on, and make it hard to mix them up.
    - Fix seeds and record versions, so that the same command gives the same
      number.
    - Commit as you go: a team that commits nothing for a long time is
      reported as stalled.
manager: |
    Approve a proposal only if each sub-team is one clear piece of the
    machinery with a way to check it.
    Prune only a team that clearly cannot work: stuck, or repeating what
    fails.
primitives:
    spec: What the team's code measures or produces, and how to run it.
    contracts: >-
        What other teams may rely on: commands, file formats, where results are
        written, what a number means.
    report: A decision and why, a setback, what failed.
actions:
    propose_teams: >-
        Split only by concern. Do not split work that shares files or is
        smaller than the cost of briefing and reviewing a team.
    submit_review: >-
        Commit, then submit when the work runs end to end and one run is
        recorded.
    review_team: >-
        Run the command yourself and compare the output with the recorded run.
        Check that reported data cannot leak into tuning.
review:
    checklist_skill: codereview
    checklist: |
        Besides the code: run the delivered command and compare its output with
        the recorded run. Check that the same command gives the same number
        twice, and that the data results are reported on is kept apart from the
        data anything is tuned on.
